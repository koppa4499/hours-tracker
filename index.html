<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stunden Übersicht</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f6f5f3;
    --card: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #e2e0dc;
    --accent: #111111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 100px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  .total-badge {
    text-align: right;
  }
  .total-badge .num {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .total-badge .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 16px 0;
    font-weight: 600;
  }

  form.entry-form {
    display: grid;
    grid-template-columns: 1.4fr 1fr 0.8fr 1fr auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 800px) {
    form.entry-form { grid-template-columns: 1fr 1fr; }
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--ink);
  }
  select.new-category-input { margin-top: 6px; }
  button {
    font-family: inherit;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
  }
  button:hover { opacity: 0.85; }
  button.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.small {
    padding: 5px 10px;
    font-size: 12px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .cat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .cat-card:hover { border-color: var(--ink); }
  .cat-card.active { border-color: var(--ink); background: #fafaf9; }
  .cat-card .cat-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .cat-card .cat-hours {
    font-size: 22px;
    font-weight: 700;
  }
  .cat-card .cat-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .cat-card .cat-bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .cat-card .cat-bar-fill {
    height: 100%;
    background: var(--ink);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
  }
  tr:last-child td { border-bottom: none; }
  td.hours-col { font-weight: 600; }
  .tag {
    display: inline-block;
    background: #efeeea;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
  }
  .del-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
  }
  .del-btn:hover { color: #c0392b; }

  .filter-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .filter-row .active-filter {
    font-size: 13px;
    color: var(--muted);
  }
  .filter-row .active-filter b { color: var(--ink); }

  .empty-state {
    color: var(--muted);
    font-size: 13px;
    padding: 20px 0;
    text-align: center;
  }

  .status-bar {
    font-size: 12px;
    color: var(--muted);
    margin-top: -12px;
    margin-bottom: 20px;
  }
  .status-bar.error { color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Stunden Übersicht</h1>
      <div class="subtitle">Arbeitszeit nach Kategorie erfassen und auswerten</div>
    </div>
    <div class="total-badge">
      <div class="num" id="totalHours">0</div>
      <div class="label">Stunden gesamt</div>
    </div>
  </header>

  <div id="statusBar" class="status-bar">Verbinde mit Supabase…</div>

  <div class="panel">
    <h2>Neuer Eintrag</h2>
    <form class="entry-form" id="entryForm">
      <div class="field">
        <label for="categorySelect">Kategorie</label>
        <select id="categorySelect">
          <option value="__new__">+ Neue Kategorie…</option>
        </select>
        <input type="text" id="newCategoryInput" class="new-category-input" placeholder="Name der neuen Kategorie" style="display:none;">
      </div>
      <div class="field">
        <label for="personInput">Person</label>
        <input type="text" id="personInput" placeholder="Name" required>
      </div>
      <div class="field">
        <label for="hoursInput">Stunden</label>
        <input type="number" id="hoursInput" step="0.25" min="0" placeholder="z.B. 2.5" required>
      </div>
      <div class="field">
        <label for="dateInput">Datum</label>
        <input type="date" id="dateInput" required>
      </div>
      <div class="field">
        <button type="submit">Hinzufügen</button>
      </div>
    </form>
    <div class="field" style="margin-top: 10px;">
      <label for="noteInput">Notiz (optional)</label>
      <input type="text" id="noteInput" placeholder="Kurze Beschreibung was gemacht wurde">
    </div>
  </div>

  <div class="panel">
    <h2>Nach Kategorie</h2>
    <div class="cards-grid" id="categoryCards">
      <div class="empty-state">Noch keine Einträge.</div>
    </div>
  </div>

  <div class="panel">
    <div class="filter-row">
      <h2 style="margin:0;">Alle Einträge</h2>
      <div class="active-filter" id="activeFilterLabel"></div>
    </div>
    <table id="entriesTable">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Kategorie</th>
          <th>Person</th>
          <th>Notiz</th>
          <th>Stunden</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="entriesBody">
        <tr><td colspan="6" class="empty-state">Noch keine Einträge.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  // ---- Supabase config ----
  // Trage hier die Werte aus eurem Supabase-Projekt ein (Project Settings -> API).
  const SUPABASE_URL = "https://wlkqoacibkoepxpccjin.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_jTzU8HTvBD97YbH0NlWBDQ_VqYJ34pI";

  let supabaseClient;
  let entries = [];
  let activeCategory = null;

  window.addEventListener('load', () => {
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      document.getElementById('dateInput').valueAsDate = new Date();
      loadEntries();
    } catch (err) {
      setStatus('Supabase-Verbindung fehlgeschlagen. Bitte URL und Key im Code prüfen.', true);
    }
  });

  function setStatus(msg, isError) {
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar' + (isError ? ' error' : '');
  }

  async function loadEntries() {
    setStatus('Lade Einträge…');
    const { data, error } = await supabaseClient
      .from('time_entries')
      .select('*')
      .order('date', { ascending: false });

    if (error) {
      setStatus('Fehler beim Laden: ' + error.message + ' — existiert die Tabelle "time_entries" in Supabase?', true);
      return;
    }
    entries = data || [];
    setStatus(entries.length + ' Einträge geladen.');
    renderAll();
  }

  function renderAll() {
    renderCategorySelect();
    renderCategoryCards();
    renderTable();
    renderTotal();
  }

  function renderTotal() {
    const total = entries.reduce((sum, e) => sum + Number(e.hours || 0), 0);
    document.getElementById('totalHours').textContent = formatHours(total);
  }

  function formatHours(n) {
    return (Math.round(n * 100) / 100).toString().replace('.', ',');
  }

  function getCategories() {
    const set = new Set(entries.map(e => e.category).filter(Boolean));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  function renderCategorySelect() {
    const select = document.getElementById('categorySelect');
    const current = select.value;
    const cats = getCategories();
    select.innerHTML = '<option value="__new__">+ Neue Kategorie…</option>' +
      cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if (cats.includes(current)) select.value = current;
    syncNewCategoryInput(false);
  }

  function syncNewCategoryInput(focus) {
    const select = document.getElementById('categorySelect');
    const newInput = document.getElementById('newCategoryInput');
    if (select.value === '__new__') {
      newInput.style.display = 'block';
      if (focus) newInput.focus();
    } else {
      newInput.style.display = 'none';
    }
  }

  document.getElementById('categorySelect').addEventListener('change', () => {
    syncNewCategoryInput(true);
  });

  function renderCategoryCards() {
    const container = document.getElementById('categoryCards');
    const cats = getCategories();
    if (cats.length === 0) {
      container.innerHTML = '<div class="empty-state">Noch keine Einträge.</div>';
      return;
    }
    const totals = cats.map(c => {
      const catEntries = entries.filter(e => e.category === c);
      const hours = catEntries.reduce((s, e) => s + Number(e.hours || 0), 0);
      const people = new Set(catEntries.map(e => e.person)).size;
      return { name: c, hours, count: catEntries.length, people };
    });
    const maxHours = Math.max(...totals.map(t => t.hours), 1);

    container.innerHTML = totals
      .sort((a, b) => b.hours - a.hours)
      .map(t => `
        <div class="cat-card ${activeCategory === t.name ? 'active' : ''}" data-cat="${escapeHtml(t.name)}">
          <div class="cat-name">${escapeHtml(t.name)}</div>
          <div class="cat-hours">${formatHours(t.hours)} h</div>
          <div class="cat-meta">${t.count} Einträge · ${t.people} Person${t.people === 1 ? '' : 'en'}</div>
          <div class="cat-bar"><div class="cat-bar-fill" style="width:${(t.hours / maxHours) * 100}%"></div></div>
        </div>
      `).join('');

    container.querySelectorAll('.cat-card').forEach(card => {
      card.addEventListener('click', () => {
        const cat = card.getAttribute('data-cat');
        activeCategory = activeCategory === cat ? null : cat;
        renderCategoryCards();
        renderTable();
      });
    });
  }

  function renderTable() {
    const body = document.getElementById('entriesBody');
    const label = document.getElementById('activeFilterLabel');
    label.innerHTML = activeCategory
      ? `Gefiltert nach <b>${escapeHtml(activeCategory)}</b> — <a href="#" id="clearFilter" style="color:inherit;">zurücksetzen</a>`
      : '';

    const clearLink = document.getElementById('clearFilter');
    if (clearLink) {
      clearLink.addEventListener('click', (e) => {
        e.preventDefault();
        activeCategory = null;
        renderCategoryCards();
        renderTable();
      });
    }

    const rows = activeCategory ? entries.filter(e => e.category === activeCategory) : entries;

    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">Keine Einträge.</td></tr>';
      return;
    }

    body.innerHTML = rows.map(e => `
      <tr>
        <td>${formatDate(e.date)}</td>
        <td><span class="tag">${escapeHtml(e.category)}</span></td>
        <td>${escapeHtml(e.person || '')}</td>
        <td>${escapeHtml(e.note || '')}</td>
        <td class="hours-col">${formatHours(Number(e.hours))}</td>
        <td><button class="del-btn" data-id="${e.id}" title="Löschen">✕</button></td>
      </tr>
    `).join('');

    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteEntry(btn.getAttribute('data-id')));
    });
  }

  function formatDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    return dt.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.getElementById('entryForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const select = document.getElementById('categorySelect');
    const newCategoryInput = document.getElementById('newCategoryInput');
    let category = select.value;
    if (category === '__new__') {
      category = newCategoryInput.value.trim();
      if (!category) {
        alert('Bitte einen Namen für die neue Kategorie eingeben.');
        return;
      }
    }

    const person = document.getElementById('personInput').value.trim();
    const hours = parseFloat(document.getElementById('hoursInput').value);
    const date = document.getElementById('dateInput').value;
    const note = document.getElementById('noteInput').value.trim();

    if (!category || !person || !hours || !date) {
      alert('Bitte alle Pflichtfelder ausfüllen.');
      return;
    }

    setStatus('Speichere…');
    const { error } = await supabaseClient
      .from('time_entries')
      .insert([{ category, person, hours, date, note }]);

    if (error) {
      setStatus('Fehler beim Speichern: ' + error.message, true);
      return;
    }

    document.getElementById('entryForm').reset();
    document.getElementById('dateInput').valueAsDate = new Date();
    newCategoryInput.style.display = 'none';
    newCategoryInput.value = '';
    document.getElementById('noteInput').value = '';

    await loadEntries();
  });

  async function deleteEntry(id) {
    if (!confirm('Diesen Eintrag wirklich löschen?')) return;
    const { error } = await supabaseClient
      .from('time_entries')
      .delete()
      .eq('id', id);
    if (error) {
      setStatus('Fehler beim Löschen: ' + error.message, true);
      return;
    }
    await loadEntries();
  }
</script>
</body>
</html>
